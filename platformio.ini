; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
lib_deps =
	adafruit/Adafruit GFX Library@^1.12.0
	adafruit/Adafruit SH110X@^2.1.12
	bblanchon/ArduinoJson@^7.4.1
	arduinogetstarted/ezButton@^1.0.6

; Custom PCB (see pcb/) -- ESP32-C3, no rotary encoder populated.
[env:pcb]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Generic ESP32 devkit -- classic ESP32, safe I2C pins (not the flash pins
; used on the PCB's C3), plus optional rotary encoder support.
[env:devkit]
platform = espressif32
board = esp32doit-devkit-v1   ; or your specific board, see: pio boards esp32
framework = arduino
build_flags =
	-mtext-section-literals
	-D OLED_SDA_PIN=21
	-D OLED_SCL_PIN=22
	-D PREV_BTN_PIN=5
	-D PLAY_BTN_PIN=18
	-D NEXT_BTN_PIN=19
	-D ENABLE_ROTARY_ENCODER
	-D ENC_CLK_PIN=4
	-D ENC_DT_PIN=2
	-D ENC_SW_PIN=15
